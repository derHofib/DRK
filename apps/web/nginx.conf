server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # /api/* geht an den API-Container (Service-Name aus docker-compose) --
  # dasselbe Verhaeltnis wie der Vite-Dev-Proxy in vite.config.ts, nur fuer
  # den Produktivbetrieb.
  location /api/ {
    proxy_pass http://api:3000/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Kein React-Router im Einsatz (die App wechselt Ansichten ueber
  # internen State, nicht ueber die URL) -- try_files reicht trotzdem als
  # Absicherung, falls sich das aendert.
  location / {
    try_files $uri $uri/ /index.html;
  }

  location = /sw.js {
    add_header Cache-Control "no-cache";
  }
}
