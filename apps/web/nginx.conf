server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # /api/* geht an den API-Container (Service-Name aus docker-compose) --
  # dasselbe Verhaeltnis wie der Vite-Dev-Proxy in vite.config.ts, nur fuer
  # den Produktivbetrieb.
  location /api/ {
    # Grundriss-Upload (StandortPlanController, Limit dort 8 MB). Der nginx-
    # Standard von 1 MB wuerde ein normales Foto mit 413 abweisen, bevor es
    # die API ueberhaupt erreicht.
    client_max_body_size 10m;
    proxy_pass http://api:3000/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Chat-Echtzeit (Server-Sent Events, chat-ereignis.service.ts): ohne diesen
  # eigenen Block puffert nginx die Antwort und die Ereignisse kaemen gesammelt
  # oder gar nicht an, und der Standard-Lesetimeout (60 s) kappt den Stream.
  # Der Server schickt alle 25 s einen Heartbeat, der Timeout liegt weit darueber.
  # Exakter Treffer (=), damit er vor dem allgemeinen /api/-Block greift.
  location = /api/chat/ereignisse {
    proxy_pass http://api:3000/chat/ereignisse;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    gzip off;
    proxy_read_timeout 1h;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Kein React-Router im Einsatz (die App wechselt Ansichten ueber
  # internen State, nicht ueber die URL) -- try_files reicht trotzdem als
  # Absicherung, falls sich das aendert.
  location / {
    try_files $uri $uri/ /index.html;
  }

  location = /sw.js {
    add_header Cache-Control "no-cache";
  }
}
